<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telão Fluxo W7M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&family=Permanent+Marker&display=swap">
<style>
/* Layout: palco 1920x1080 escalado; preto chapado da identidade Segue o FX, gradiente rosa→roxo só nos acentos; esquerda = contagem, direita = selo + fila */
:root{
  --black:#060507;
  --shard:#111014;
  --line:#2a2530;
  --pink:#ff1f55;
  --violet:#a42cff;
  --white:#ffffff;
  --mute:#8f8a96;
  --grad:linear-gradient(90deg,var(--pink) 0%,#ff2a8a 55%,var(--violet) 100%);
  --f-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-ui:"Archivo","Arial",sans-serif;
  --f-brush:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  color-scheme:dark;
}
html,body{height:100%;background:var(--black);color:var(--white);margin:0;overflow:hidden}
body{font-family:var(--f-ui)}
#fit{position:fixed;inset:0;overflow:hidden;background:var(--black)}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;overflow:hidden;transform-origin:center center;background:var(--black)}
.shards{position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(118deg,transparent 0 62%,var(--shard) 62% 70%,transparent 70%),
   linear-gradient(64deg,transparent 0 8%,var(--shard) 8% 13%,transparent 13%),
   linear-gradient(150deg,transparent 0 84%,var(--shard) 84% 90%,transparent 90%)}

header{position:absolute;top:60px;left:96px;right:96px;display:flex;justify-content:space-between;align-items:center}
.brand{height:104px;width:auto;display:block}
.crest{position:absolute;left:420px;top:120px;width:820px;height:820px;opacity:.06;animation:spin 120s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.timebox{padding-left:36px;border-left:2px solid var(--line);text-align:right}
#today{font-weight:700;font-size:17px;letter-spacing:.22em;color:var(--mute);margin-top:4px;text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:36px}
.agenda{text-align:right;font-weight:700;font-size:22px;letter-spacing:.3em;line-height:1.5}
.agenda small{display:block;font-weight:600;font-size:16px;color:var(--mute);letter-spacing:.28em}
#clock{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}

#main{position:absolute;left:96px;top:200px;width:1040px;bottom:160px;display:flex;flex-direction:column}
.modrow{display:flex;align-items:center;gap:22px}
.modlogo{height:96px;width:auto;max-width:320px;object-fit:contain;display:block}
.has-logo .strip{display:none}
.strip{font-family:var(--f-brush);font-size:40px;line-height:1;color:var(--pink);transform:rotate(-2deg)}
.item .gl{width:96px;height:58px;object-fit:contain;object-position:right center;display:block;opacity:.95}
.item .nogl{display:none}
.item .gl-ea-fc{height:46px;object-position:center center}
.camp{margin-top:22px;font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.vs{margin-top:20px;font-family:var(--f-display);text-transform:uppercase;line-height:.92;letter-spacing:-.01em}
.vs .us{display:block;font-size:150px}
.vs .x{display:block;font-family:var(--f-brush);text-transform:none;font-size:62px;color:var(--pink);margin:6px 0 2px}
.vs .them{display:inline-block;white-space:nowrap;font-size:118px;transform-origin:left bottom;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.12em}
.is-br .x{display:none}
.is-br .them{margin-top:14px}

.count{margin-top:auto;display:flex;gap:34px;align-items:flex-end}
.unit .n{display:block;font-family:var(--f-display);font-size:132px;line-height:.9;font-variant-numeric:tabular-nums;min-width:1.25em}
.unit .bar{display:block;height:6px;background:var(--grad);margin-top:14px}
.unit .l{display:block;margin-top:12px;font-weight:700;font-size:17px;letter-spacing:.32em;color:var(--mute)}
.when{margin-top:22px;font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.when b{color:var(--pink);font-weight:800}
#live{display:none;margin-top:auto;gap:48px;align-items:center;max-width:1040px}
#live>div:first-child{min-width:0}
.lv-top{font-family:var(--f-display);font-size:76px;line-height:.9;white-space:nowrap}
.lv-top i{display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--pink);margin-right:26px;vertical-align:middle;box-shadow:0 0 40px var(--pink);animation:pulse 1.2s ease-in-out infinite}
.lv-btn{display:inline-flex;align-items:center;gap:14px;margin-top:30px;padding:18px 30px;background:var(--grad);color:var(--white);text-decoration:none;font-family:var(--f-display);font-size:30px;letter-spacing:.02em;text-transform:uppercase;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.lv-btn:focus-visible{outline:3px solid var(--white);outline-offset:4px}
#lv-url{display:block;margin-top:14px;font-weight:700;font-size:20px;letter-spacing:.08em;color:var(--mute)}
.lv-qr{flex:none;background:var(--white);padding:12px;text-align:center}
#lv-qr,#lv-qr img,#lv-qr canvas{display:block;width:176px;height:176px}
.lv-qr small{display:block;margin-top:8px;font-weight:800;font-size:13px;letter-spacing:.16em;color:var(--black)}
.nolink .lv-btn,.nolink #lv-url,.nolink .lv-qr{display:none}
@keyframes pulse{50%{transform:scale(.6);opacity:.4}}
.is-live .count,.is-live .when{display:none}
.is-live #live{display:flex}
.camp:empty{display:none}

#side{position:absolute;right:96px;top:176px;width:620px;bottom:160px;display:flex;flex-direction:column}
.seal{align-self:center;width:150px;height:150px;border-radius:50%;position:relative;margin-bottom:20px;flex:none}
.seal::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 200deg,var(--violet),var(--pink),var(--violet));filter:blur(26px);opacity:.55;animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.25}}
.seal img{position:relative;width:100%;height:100%;display:block}
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.qhead h2{margin:0;font-family:var(--f-display);font-size:38px;text-transform:uppercase}
.qhead small{font-weight:700;font-size:17px;letter-spacing:.22em;color:var(--mute)}
#list{display:flex;flex-direction:column;gap:10px}
.item{position:relative;padding:12px 24px 12px 22px;display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;
  --cut:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  clip-path:var(--cut);background:var(--grad);isolation:isolate;opacity:0;transform:translateX(40px);animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
.item::before{content:"";position:absolute;inset:2px;background:var(--black);clip-path:var(--cut);z-index:-1;transition:background .6s}
.item.hl::before{background:var(--shard)}
@keyframes in{to{opacity:1;transform:none}}
.item .idx{font-family:var(--f-display);font-size:42px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.item .meta{font-weight:700;font-size:14px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-family:var(--f-display);font-size:28px;text-transform:uppercase;line-height:1.15;margin:4px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.empty{color:var(--mute);font-size:20px;letter-spacing:.1em}

footer{position:absolute;left:0;right:0;bottom:0;height:88px;display:flex;align-items:center;overflow:hidden;background:var(--black)}
footer::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad);z-index:2}
footer .lbl{flex:none;height:100%;display:grid;place-items:center;padding:0 40px 0 96px;font-family:var(--f-brush);font-size:36px;background:var(--black);z-index:1;position:relative}
.track{display:flex;white-space:nowrap;animation:tick 50s linear infinite}
.track span{font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase;padding:0 36px}
.track span::after{content:"";display:inline-block;width:10px;height:10px;background:var(--pink);transform:rotate(45deg);margin-left:72px;vertical-align:middle}
@keyframes tick{to{transform:translateX(-50%)}}

#tools{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;opacity:.12;transition:opacity .2s;z-index:5}
#tools:hover,#tools:focus-within{opacity:1}
button{font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:var(--shard);color:var(--white);border:1px solid var(--line);padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--pink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button.pri{background:var(--pink);border-color:var(--pink)}
#editor{position:fixed;inset:0;background:rgba(6,5,7,.94);z-index:10;overflow:auto;padding-block:32px;padding-inline:16px}
#editor .box{max-width:980px;margin:0 auto;background:var(--shard);border:1px solid var(--line);padding:24px}
#editor h3{margin:0 0 6px;font-family:var(--f-display);font-size:30px;text-transform:uppercase}
#editor p{margin:0 0 18px;color:var(--mute);font-size:14px;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1.5fr 1.3fr 1.2fr auto;gap:8px;margin-bottom:8px}
.row input{min-width:0;background:var(--black);border:1px solid var(--line);color:var(--white);padding:9px;font-family:var(--f-ui);font-size:14px}
.hdrs{font-size:11px;letter-spacing:.18em;color:var(--mute);font-weight:700;text-transform:uppercase}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
@media (max-width:700px){.row{grid-template-columns:1fr 1fr}.hdrs{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.item{opacity:1;transform:none}}
</style>
</head>

    if(tag&&re.test(tag)){mod=name;break}
    if(!tag&&re.test(rest)){mod=name;if(strip)rest=rest.replace(re,"").trim();break}
  }
  if(!mod)mod=tag?tag.replace(/\b\w/g,c=>c.toUpperCase()):"Fluxo W7M";
  rest=rest.replace(/^#\d+\s*/,"").replace(/\s+/g," ").trim();
  const parts=rest.split(/\s+vs\.?\s+/i);
  if(parts.length>1)return{mod,camp:parts[0].trim(),opp:parts.slice(1).join(" vs ").trim().replace(/\s*\/\s*/g," / "),vs:true};
  return{mod,camp:"",opp:rest||mod,vs:false};
}
function build(){
  return events.map(e0=>{const k=Object.keys(OVR).find(k=>String(e0.id||"").startsWith(k));const e=k?{...e0,...OVR[k]}:e0;const p=parse(e.title);const s=new Date(e.start);const en=e.end?new Date(e.end):new Date(s.getTime()+3*3600e3);
    return{...p,id:e.id||e.start+e.title,t:s,end:en,live:e.live||LIVE[p.mod]||""}}).filter(g=>!isNaN(g.t)).sort((a,b)=>a.t-b.t);
}
async function sync(){
  try{const r=await fetch("overrides.json?t="+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&typeof j==="object")OVR=j}}catch(e){}
  try{const r=await fetch("live.json?t="+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&typeof j==="object")LIVE={...LIVE,...j}}}catch(e){}
  try{const r=await fetch("agenda.json?t="+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();if(Array.isArray(j.events)&&j.events.length)events=j.events}}catch(e){}
  games=build();currentKey=listKey="";
}

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const DIAS=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"],MESES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmt=d=>`${DIAS[d.getDay()]} · ${pad(d.getDate())} DE ${MESES[d.getMonth()]} · ${hm(d)}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=m=>m.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-");
const logoSrc=m=>`logos/${slug(m)}.png`;
const big=g=>g.vs?g.opp:g.opp;
const line=g=>g.vs?`Fluxo W7M vs. ${g.opp}`:`Fluxo W7M · ${g.opp}`;

function fit(){const f=$("fit");const s=Math.min(f.clientWidth/1920,f.clientHeight/1080);$("stage").style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);addEventListener("fullscreenchange",fit);fit();
function fitOpp(){const el=$("m-opp");el.style.transform="none";const w=el.offsetWidth,max=1020;el.style.transform=w>max?`scale(${max/w})`:"none"}

let games=build(),currentKey="",listKey="",qrUrl="";
function setLive(url){
  const main=$("main");main.classList.toggle("nolink",!url);
  if(!url||url===qrUrl)return;qrUrl=url;
  $("lv-link").href=url;$("lv-url").textContent=url.replace(/^https?:\/\/(www\.)?/,"");
  const box=$("lv-qr");box.innerHTML="";
  try{new QRCode(box,{text:url,width:176,height:176,colorDark:"#060507",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M})}catch(e){box.parentNode.style.display="none"}
}

function render(){
  const now=Date.now(),nd=new Date(now);
  $("clock").textContent=hm(nd);$("today").textContent=`${DIAS[nd.getDay()]} · ${pad(nd.getDate())} DE ${MESES[nd.getMonth()]} · ${nd.getFullYear()}`;
  const up=games.filter(g=>g.end.getTime()>now),next=up[0],main=$("main");
  if(!next){currentKey="";$("m-opp").textContent="Em breve";$("m-mod").textContent="Agenda";$("m-camp").textContent="";$("m-when").textContent="Novos jogos em breve";["d","h","m","s"].forEach(k=>$("c-"+k).textContent="00");main.classList.remove("is-live");main.classList.add("is-br")}
  else{
    const live=next.t.getTime()<=now;
    const k=next.id+(live?"L":"");
    if(k!==currentKey){currentKey=k;
      $("m-opp").textContent=big(next);$("m-mod").textContent=next.mod;$("m-camp").textContent=next.camp;
      const im=$("m-logo");im.hidden=true;const row=im.parentNode;row.classList.remove("has-logo");im.onload=()=>{im.hidden=false;row.classList.add("has-logo")};im.onerror=()=>{im.hidden=true;row.classList.remove("has-logo")};im.src=logoSrc(next.mod);
      main.classList.toggle("is-br",!next.vs);main.classList.toggle("is-live",live);
      $("m-when").innerHTML=live?`Começou às <b>${hm(next.t)}</b> · previsão de término <b>${hm(next.end)}</b>`:`O jogo começa <b>${fmt(next.t)} · BRT</b>`;
      if(live)setLive(next.live);
      fitOpp();
    }
    const s=Math.floor(Math.max(0,next.t-now)/1000);
    $("c-d").textContent=pad(Math.floor(s/86400));$("c-h").textContent=pad(Math.floor(s%86400/3600));
    $("c-m").textContent=pad(Math.floor(s%3600/60));$("c-s").textContent=pad(s%60);
  }
  const rest=up.slice(1,6),lk=rest.map(g=>g.id).join("|");
  if(lk!==listKey){listKey=lk;
    $("list").innerHTML=rest.length?rest.map((g,i)=>`<div class="item" style="animation-delay:${i*.1}s"><div class="idx">${pad(i+2)}.</div><div style="min-width:0"><div class="meta">${esc(g.mod)}${g.vs&&g.camp?" · "+esc(g.camp):""}</div><div class="m">${esc(g.vs?"vs. "+g.opp:g.opp)}</div><div class="d">${fmt(g.t)}</div></div><img class="gl gl-${slug(g.mod)}" src="${logoSrc(g.mod)}" alt="" onerror="this.className='nogl'"></div>`).join(""):`<div class="empty">Sem outros jogos agendados.</div>`;
    $("q-count").textContent=up.length?`01 / ${pad(up.length)}`:"";
    const items=[...up.slice(0,6).map(g=>`${g.mod} · ${line(g)} · ${fmt(g.t)}`),"Seja Sócio Torcedor Fluxo W7M"];
    const t=items.map(x=>`<span>${esc(x)}</span>`).join("");$("track").innerHTML=t+t;
  }
}
let hl=0;setInterval(()=>{const it=[...document.querySelectorAll(".item")];if(!it.length)return;it.forEach(e=>e.classList.remove("hl"));it[hl%it.length].classList.add("hl");hl++},3500);
render();setInterval(render,250);document.fonts&&document.fonts.ready.then(fitOpp);
sync();setInterval(sync,5*60e3);

$("btn-fs").onclick=async()=>{try{await document.documentElement.requestFullscreen()}catch(e){}try{await navigator.wakeLock?.request("screen")}catch(e){}};
</script>

</body>
</html>
